<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التسجيل في المحاضرة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Aref+Ruqaa:wght@700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#0f766e;--ac2:#ccfbf1;--bd:#e5e7eb;--er:#b91c1c;--wa:#fef3c7;--bt:#fff;--hi:#be123c;--sl:#b45309}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111816;--card:#1a2321;--tx:#e8eeec;--mu:#9aa8a4;--ac:#2dd4bf;--ac2:#134e4a;--bd:#2b3936;--er:#f87171;--wa:#422006;--bt:#06201c;--hi:#fb7185;--sl:#fbbf24}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.brand{border:2px solid var(--ac);border-radius:16px;padding:18px 16px;text-align:center;background:var(--card);margin-bottom:14px}
.slogan{font-family:'Aref Ruqaa','Reem Kufi',Amiri,'Traditional Arabic',serif;font-weight:700;font-size:clamp(3rem,14vw,5rem);line-height:1.4;color:var(--sl);margin-top:4px}
.hero{background:var(--ac);color:var(--bt);border-radius:16px;padding:26px 20px;text-align:center}
.tag{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 14px;font-size:.9rem}
h1{margin:10px 0 4px;font-size:1.7rem;line-height:1.4}
.hero p{margin:0;opacity:.92}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:14px}
h2{margin:0 0 10px;font-size:1.15rem}
.info{display:grid;gap:10px}
.info div{background:var(--bg);border-radius:10px;text-align:center;padding:16px 12px}
.info small{display:block;color:var(--mu);font-size:1.1rem;font-weight:600}
.info b{display:block;font-size:1.9rem;line-height:1.5;color:var(--hi)}
#desc{font-family:'Noto Naskh Arabic',Amiri,'Traditional Arabic',Tahoma,serif;font-size:1.3rem;line-height:2.1;display:block;margin-top:4px}
.dl{display:grid;gap:8px;margin:8px auto 4px;max-width:340px}
.dl div{border:2px solid var(--ac);background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.dl small{display:block;font-size:.9rem;color:var(--mu)}
.dl b{display:block;font-weight:700;font-size:1.25rem;line-height:1.5;color:var(--ac)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.95rem}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
button,a.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--ac);color:var(--bt);font-weight:600;width:100%;margin-top:14px;display:block;text-align:center;text-decoration:none;box-sizing:border-box}
button:disabled{opacity:.6;cursor:default}
.msg{border-radius:10px;padding:12px;margin-top:12px;text-align:center}
.ok{background:var(--ac2)}.warn{background:var(--wa)}.err{color:var(--er);font-size:.9rem;margin-top:8px;text-align:center}
</style>
</head>
<body>
<main>
<header class="brand">
  <svg viewBox="0 0 100 120" width="84" height="100" role="img" aria-label="Dominican Order emblem" style="display:block;margin:0 auto 10px"><defs><clipPath id="shd"><path d="M6 6h88v50c0 34-26 52-44 60C32 108 6 90 6 56z"/></clipPath></defs><g clip-path="url(#shd)"><rect width="50" height="120" fill="#fff"/><rect x="50" width="50" height="120" fill="#111"/><rect x="44" y="14" width="6" height="86" fill="#111"/><rect x="50" y="14" width="6" height="86" fill="#fff"/><rect x="20" y="42" width="30" height="12" fill="#111"/><rect x="50" y="42" width="30" height="12" fill="#fff"/><circle cx="20" cy="48" r="7" fill="#111"/><circle cx="80" cy="48" r="7" fill="#fff"/><path d="M50 7a7 7 0 0 0 0 14z" fill="#111"/><path d="M50 7a7 7 0 0 1 0 14z" fill="#fff"/><path d="M50 93a7 7 0 0 0 0 14z" fill="#111"/><path d="M50 93a7 7 0 0 1 0 14z" fill="#fff"/></g><path d="M6 6h88v50c0 34-26 52-44 60C32 108 6 90 6 56z" fill="none" stroke="currentColor" stroke-width="3"/></svg>
  <div class="slogan">لنفكر معًا!</div>
</header>

<section class="hero">
  <span class="tag" id="price"></span>
  <h1 id="title"></h1>
  <p id="speaker"></p>
</section>

<section class="card">
  <div class="info">
    <div><small>الموعد</small><b id="when"></b></div>
    <div><small>المكان</small><b id="where"></b></div>
    <div><small>عن الفعالية</small><span id="desc"></span></div>
  </div>
</section>

<section class="card">
  <h2>التسجيل</h2>
  <div class="dl" id="dl"></div>
  <div id="regBody"></div>
</section>
</main>

<script>
// ============ عدّل هذه الإعدادات فقط ============
const EVENT = {
  title: "عنوان المحاضرة هنا",
  speaker: "د. اسم المحاضر · الجهة",
  start: "2026-11-24T19:00:00+03:00",      // موعد الفعالية
  deadline: "2026-11-20T23:59:00+03:00",   // آخر موعد للتسجيل
  place: "القاعة الكبرى / عبر الإنترنت",
  desc: "نبذة قصيرة عن موضوع الفعالية والفئة المستهدفة وما سيستفيده الحاضرون.",
  price: 0,                                // 0 = مجاني
  currency: "USD",
  payInfo: "",                             // تعليمات الدفع (تحويل، حساب...)
  payLink: ""                              // رابط دفع إلكتروني https://...
};
// رابط استقبال التسجيلات من خدمة نماذج، مثل Formspree: https://formspree.io/f/xljbrlar
const FORM_ENDPOINT = "";
// ===============================================

const $ = id => document.getElementById(id);
const dt = o => new Intl.DateTimeFormat("ar", o);
const start = new Date(EVENT.start), deadline = new Date(EVENT.deadline);
const cost = EVENT.price > 0 ? EVENT.price + " " + EVENT.currency : "مجاني";
const KEY = "reg:" + EVENT.title;
const isOpen = () => Date.now() < deadline.getTime();
let done = false;
try { done = localStorage.getItem(KEY) === "1"; } catch (e) {}

document.title = EVENT.title;
$("title").textContent = EVENT.title; $("speaker").textContent = EVENT.speaker;
$("when").textContent = dt({dateStyle: "full", timeStyle: "short"}).format(start);
$("where").textContent = EVENT.place; $("desc").textContent = EVENT.desc; $("price").textContent = cost;
$("dl").innerHTML = '<div><small>📅 تاريخ انتهاء التسجيل</small><b>' + dt({dateStyle: "full"}).format(deadline) + '</b></div><div><small>🕒 الساعة</small><b>' + dt({timeStyle: "short"}).format(deadline) + '</b></div>';

function payBox(parent) {
  if (!(EVENT.price > 0)) return;
  const w = document.createElement("div"); w.className = "msg warn"; w.textContent = "المبلغ المطلوب: " + cost;
  if (EVENT.payInfo) { const p = document.createElement("div"); p.style.cssText = "margin-top:6px;white-space:pre-wrap"; p.textContent = EVENT.payInfo; w.append(p); }
  if (/^https:\/\//.test(EVENT.payLink)) { const a = document.createElement("a"); a.className = "btn"; a.href = EVENT.payLink; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = "ادفع الآن"; w.append(a); }
  parent.append(w);
}
function render() {
  const b = $("regBody"); b.textContent = "";
  if (done) {
    const m = document.createElement("div"); m.className = "msg ok"; m.textContent = "✓ تم استلام تسجيلك. نراك في الفعالية!"; b.append(m); payBox(b); return;
  }
  if (!isOpen()) { const m = document.createElement("div"); m.className = "msg warn"; m.textContent = "أُغلق باب التسجيل."; b.append(m); return; }
  b.innerHTML = '<label for="n">الاسم الكامل *</label><input id="n" autocomplete="name" maxlength="80"><label for="e">البريد الإلكتروني *</label><input id="e" type="email" autocomplete="email" maxlength="120" dir="ltr" style="text-align:right"><label for="p">رقم الهاتف (اختياري)</label><input id="p" type="tel" autocomplete="tel" maxlength="30" dir="ltr" style="text-align:right"><button id="go"></button><div class="err" id="er"></div>';
  $("go").textContent = EVENT.price > 0 ? "سجّل وتابع الدفع (" + cost + ")" : "سجّل مشاركتي";
  $("go").onclick = async () => {
    const name = $("n").value.trim(), email = $("e").value.trim(), phone = $("p").value.trim();
    if (!name || !/^\S+@\S+\.\S+$/.test(email)) { $("er").textContent = "أدخل الاسم وبريداً إلكترونياً صحيحاً."; return; }
    if (!FORM_ENDPOINT) { $("er").textContent = "التسجيل غير مفعّل بعد: لم يُضبط رابط استقبال التسجيلات."; return; }
    if (!isOpen()) return render();
    $("go").disabled = true; $("er").textContent = "";
    try {
      const r = await fetch(FORM_ENDPOINT, {method: "POST", headers: {"Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify({name, email, phone, event: EVENT.title, price: cost, time: new Date().toISOString()})});
      if (!r.ok) throw new Error();
      done = true; try { localStorage.setItem(KEY, "1"); } catch (e) {}
      render();
    } catch (e) { $("er").textContent = "تعذّر إرسال التسجيل، حاول مرة أخرى."; $("go").disabled = false; }
  };
}
render();
setInterval(() => { if (!done && !isOpen()) render(); }, 30000);
</script>
</body>
</html>
